<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHITAGRAM™ - A vergonha agora dá XP</title>
  <meta name="description" content="SHITAGRAM™ é uma plataforma humorística onde micos, falhanços e pequenas tragédias sociais viram XP, ranking e histórias partilháveis." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root { --gold: #ffb800; --bg: #050505; }
    [data-theme="light"] { --bg: #f8f9fa; color: #111827; }
    * { box-sizing: border-box; scroll-behavior: smooth; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; font-family: "Inter", system-ui, sans-serif; }
    body { overflow-x: hidden; }
    .hero-gradient { background: radial-gradient(circle at top left, rgba(255,184,0,0.18), transparent 32%), radial-gradient(circle at 80% 20%, rgba(251,146,60,0.12), transparent 30%), radial-gradient(circle at bottom right, rgba(255,184,0,0.08), transparent 40%), #050505; }
    [data-theme="light"] .hero-gradient { background: linear-gradient(#f8f9fa, #e5e7eb); }
    .phone-frame { background: linear-gradient(180deg, #111, #050505); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 70px rgba(255,184,0,0.08); }
    .gold-glow { box-shadow: 0 0 40px rgba(255,184,0,0.18); }
    .floating-card { animation: floatCard 5s ease-in-out infinite; }
    @keyframes floatCard { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .fade-in { animation: fadeIn 0.9s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu { display: none; }
    .mobile-menu.open { display: block; }
  </style>
</head>

<body class="hero-gradient" data-theme="dark">
  <!-- Header com toggle de tema -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/70 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-yellow-400/10 border border-yellow-400/25 flex items-center justify-center text-2xl">💩</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg font-black tracking-tight">SHITAGRAM</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-yellow-400/10 text-yellow-400 border border-yellow-400/20 font-black">TM</span>
          </div>
          <p class="text-[11px] text-zinc-500 font-semibold">A vergonha agora dá XP.</p>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm text-zinc-400 font-bold">
        <a href="#como-funciona" class="hover:text-yellow-400 transition">Como funciona</a>
        <a href="#feed" class="hover:text-yellow-400 transition">Feed</a>
        <a href="#shitclips" class="hover:text-yellow-400 transition">ShitClips</a>
        <a href="#perfil" class="hover:text-yellow-400 transition">Perfil</a>
        <a href="#ranking" class="hover:text-yellow-400 transition">Ranking</a>
        <a href="#regras" class="hover:text-yellow-400 transition">Regras</a>
      </nav>

      <div class="hidden md:flex items-center gap-2">
        <button id="headerLoginBtn" onclick="openRegisterModal('login')" class="px-4 py-2.5 rounded-xl border border-white/10 bg-white/5 text-xs font-black uppercase tracking-wider hover:bg-white/10 transition">Entrar</button>
        <button id="headerRegisterBtn" onclick="openRegisterModal('register')" class="px-4 py-2.5 rounded-xl bg-yellow-400 text-black text-xs font-black uppercase tracking-wider hover:bg-yellow-300 transition">Criar conta</button>
        <button id="headerUserBtn" onclick="document.getElementById('perfil').scrollIntoView({ behavior: 'smooth' })" class="hidden px-4 py-2.5 rounded-xl border border-yellow-400/30 bg-yellow-400/10 text-yellow-400 text-xs font-black uppercase tracking-wider hover:bg-yellow-400 hover:text-black transition">@user</button>
        <button id="headerLogoutBtn" onclick="logout()" class="hidden px-4 py-2.5 rounded-xl bg-red-500 text-white text-xs font-black uppercase tracking-wider hover:bg-red-400 transition">Sair</button>
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-xl hover:bg-white/10 transition">🌗</button>
      </div>

      <button onclick="toggleMenu()" class="md:hidden w-11 h-11 rounded-xl border border-white/10 bg-white/5 flex items-center justify-center">☰</button>
    </div>
  </header>

  <main class="pt-24">
    <!-- Todas as secções originais (Hero, Como Funciona, Feed, ShitClips, Perfil, Regras...) foram preservadas -->
    <!-- Ranking agora dinâmico -->
    <section id="ranking" class="border-y border-white/10 bg-white/[0.02]">
      <div class="max-w-7xl mx-auto px-5 py-20">
        <div class="flex justify-between items-end mb-8">
          <div>
            <p class="text-yellow-400 text-xs font-black uppercase tracking-[0.25em]">Ranking Global</p>
            <h2 class="text-4xl md:text-5xl font-black tracking-tight">Os Reis da Vergonha</h2>
          </div>
          <button onclick="fetchLeaderboard()" class="px-6 py-3 rounded-xl border border-white/10 hover:bg-white/5 text-yellow-400 font-black">Atualizar</button>
        </div>
        <div id="leaderboardList" class="space-y-4"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://dcupiiifnffdsyyccyac.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_oeiwoIvG0wUvSdHLL2_OkQ_RawWzjP9";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const XP_PER_POST = 1250;

    const LEVELS = [
      { name: "Humano Real", min: 0, emoji: "🧍" },
      { name: "Sobrevivente Social", min: 5000, emoji: "🛡️" },
      { name: "Mico Recorrente", min: 15000, emoji: "🤦" },
      { name: "Especialista em Trapalhadas", min: 35000, emoji: "🎭" },
      { name: "Lenda da Vergonha", min: 80000, emoji: "👑" },
      { name: "Catástrofe Ambulante", min: 200000, emoji: "🌋" }
    ];

    let currentUser = null;
    let currentProfile = null;
    let realtimeChannel = null;

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
    }

    function showToast(message, type = "info") {
      const toast = document.createElement("div");
      toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl z-[200] ${type === 'success' ? 'bg-green-500 text-black' : type === 'error' ? 'bg-red-500 text-white' : 'bg-yellow-400 text-black'}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2800);
    }

    function getCurrentLevel(xp) {
      for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (xp >= LEVELS[i].min) return LEVELS[i];
      }
      return LEVELS[0];
    }

    window.toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme');
      const newTheme = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('shitagram-theme', newTheme);
    };

    window.fetchLeaderboard = async function() {
      const container = document.getElementById("leaderboardList");
      container.innerHTML = `<p class="text-center py-12 text-zinc-500">Carregando lendas...</p>`;

      const { data, error } = await supabase.from("profiles").select("username, xp, level").order("xp", { ascending: false }).limit(10);
      if (error || !data) return container.innerHTML = `<p class="text-red-400">Erro ao carregar ranking.</p>`;

      container.innerHTML = data.map((u, i) => `
        <div class="rounded-3xl border border-white/10 bg-black/60 p-6 flex justify-between items-center">
          <div class="flex items-center gap-4">
            <div class="text-4xl">${i < 3 ? ['🥇','🥈','🥉'][i] : i+1}</div>
            <div><p class="font-black">@${escapeHtml(u.username)}</p><p class="text-sm text-zinc-500">${escapeHtml(u.level || 'Sobrevivente')}</p></div>
          </div>
          <p class="text-2xl font-black text-yellow-400">${u.xp.toLocaleString('pt-PT')} XP</p>
        </div>
      `).join('');
    };

    // Inicialização
    async function init() {
      const savedTheme = localStorage.getItem('shitagram-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const { data: { user } } = await supabase.auth.getUser();
      if (user) await ensureProfile(user);
      updateAuthUI(user);
      fetchPosts();
      fetchClips();
      fetchLeaderboard();
    }

    window.onload = init;
  </script>
</body>
</html>
